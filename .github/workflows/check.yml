name: Check

# Not on every push: on pull requests, by hand, and before every release (release.yml calls it).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:check
